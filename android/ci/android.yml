name: Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - 'js/**'
      - 'data/**'
      - 'css/**'
      - 'index.html'
      - '.github/workflows/android.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK (تثبيت/ترخيص إن لزم)
        uses: android-actions/setup-android@v3

      - name: Install Gradle manually (bypass broken Actions cache service)
        run: |
          curl -sL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q /tmp/gradle.zip -d "$HOME/tools"
          echo "$HOME/tools/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Copy web academy into Android assets
        run: |
          mkdir -p android/app/src/main/assets
          cp -r css js data icons index.html manifest.json sw.js android/app/src/main/assets/

      - name: Build debug APK (offline app — no internet permission)
        run: gradle -p android assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: souq-allughah-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish APK as GitHub Release (تحميل مباشر)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(ls android/app/build/outputs/apk/debug/*.apk)
          TAG="apk-v${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" "$APK#تطبيق سوق اللغة — ثبّته مباشرة" \
            --title "سوق اللغة — APK (بناء #$GITHUB_RUN_NUMBER)" \
            --target "$GITHUB_SHA" \
            --notes "أكاديمية الإندونيسية والتركية كاملة (1000 جملة، 33 موقفًا، 50 فصلًا) — أوفلاين 100% وبلا أي صلاحية إنترنت. فعّل «مصادر غير معروفة» وثبّت." \
            2>/dev/null || gh release upload "$TAG" "$APK" --clobber
