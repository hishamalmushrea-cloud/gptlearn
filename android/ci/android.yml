name: Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - 'js/**'
      - 'data/**'
      - 'css/**'
      - 'index.html'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Copy web academy into Android assets
        run: |
          mkdir -p android/app/src/main/assets
          cp -r css js data icons index.html manifest.json sw.js android/app/src/main/assets/

      - name: Build debug APK (أوفلاين — بلا صلاحية إنترنت)
        run: gradle -p android assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: souq-allughah-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
