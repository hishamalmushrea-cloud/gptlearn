name: Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - 'js/**'
      - 'data/**'
      - 'css/**'
      - 'index.html'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle manually (bypass broken Actions cache service)
        run: |
          curl -sL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q /tmp/gradle.zip -d "$HOME/tools"
          echo "$HOME/tools/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Copy web academy into Android assets
        run: |
          mkdir -p android/app/src/main/assets
          cp -r css js data icons index.html manifest.json sw.js android/app/src/main/assets/

      - name: Build debug APK (offline app — no internet permission)
        run: gradle -p android assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: souq-allughah-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
